<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="0; url=./virtual-chromatography-diagnostic-lab.html" />
    <title>Chromatography</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --panel: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --accent: #2563eb;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #eff6ff, var(--bg));
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
      }

      .card {
        width: min(90vw, 700px);
        background: var(--panel);
        border-radius: 18px;
        box-shadow: 0 20px 45px rgba(37, 99, 235, 0.12);
        padding: 3rem 2rem;
        text-align: center;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2rem, 4vw, 3rem);
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.6;
      }

      .badge {
        display: inline-block;
        margin-bottom: 1rem;
        padding: 0.5rem 0.9rem;
        border-radius: 999px;
        background: rgba(37, 99, 235, 0.08);
        color: var(--accent);
        font-weight: 700;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        font-size: 0.75rem;
      }

      .link {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.8rem 1.2rem;
        border-radius: 999px;
        background: var(--accent);
        color: white;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">Virtual Lab</div>
      <h1>Chromatography</h1>
      <p>This site is live and the GitHub Pages entry point is working.</p>
      <p>Redirecting to the lab app…</p>
      <a class="link" href="./virtual-chromatography-diagnostic-lab.html">Open the lab</a>
    </main>
  </body>
</html>
